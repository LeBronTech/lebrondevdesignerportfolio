<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="logoDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#DC2626" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular background badge for clean contrast -->
  <rect width="500" height="500" rx="100" fill="#FFFFFF" />
  <circle cx="250" cy="250" r="235" fill="none" stroke="#F1F5F9" stroke-width="8" />

  <!-- Central Emblem: Segmented geometric icon -->
  <g transform="translate(250, 160)" filter="url(#softGlow)">
    <!-- Outer hexagonal / rounded bracket left (Slate) -->
    <path d="M -30,-65 C -60,-50 -75,-25 -75,0 C -75,25 -60,50 -30,65 L -45,45 C -62,32 -65,15 -65,0 C -65,-15 -62,-32 -45,-45 Z" fill="url(#logoDarkGrad)" />
    
    <!-- Outer hexagonal / rounded bracket right (Red) -->
    <path d="M 30,-65 C 60,-50 75,-25 75,0 C 75,25 60,50 30,65 L 45,45 C 62,32 65,15 65,0 C 65,-15 62,-32 45,-45 Z" fill="url(#logoRedGrad)" />

    <!-- Inner interlocking arcs / geometric diamond arrows -->
    <path d="M -15,-40 L 0,-55 L 15,-40 L 0,-25 Z" fill="#DC2626" />
    <path d="M -25,-15 L -40,0 L -25,15 L -10,0 Z" fill="#1E293B" />
    <path d="M 25,-15 L 40,0 L 25,15 L 10,0 Z" fill="#DC2626" />
    <path d="M -15,40 L 0,55 L 15,40 L 0,25 Z" fill="#1E293B" />

    <!-- Center core badge -->
    <circle cx="0" cy="0" r="14" fill="#B91C1C" />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="250" y="310" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#DC2626" letter-spacing="4">CREDITA</text>
    <text x="250" y="360" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="48" fill="#1E293B" letter-spacing="8">BSB</text>
    
    <!-- Accent underline bar -->
    <rect x="180" y="380" width="140" height="4" rx="2" fill="#DC2626" />
    
    <text x="250" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#64748B" letter-spacing="4">SEU AGENTE DE CRÉDITO</text>
  </g>
</svg>
